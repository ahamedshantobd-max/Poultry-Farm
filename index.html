<!DOCTYPE html>
<html lang="bn">
<head>
   <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUG91bHRyeSBGYXJtIE1hbmFnZXIiLCJzaG9ydF9uYW1lIjoiUG91bHRyeSIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMWExYTFhIiwidGhlbWVfY29sb3IiOiIjNENBRjUwIiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vaW1nLmljb25zOC5jb20vY29sb3IvNTEyL2NoaWNrZW4ucG5nIiwic2l6ZXMiOiI1MTJ4NTEyIiwidHlwZSI6ImltYWdlL3BuZyJ9XX0=">
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
   <link rel="icon" href="https://img.icons8.com/color/512/chicken.png">
   <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/chicken.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>পোল্ট্রি ফার্ম ম্যানেজার</title>
    <style>
        /* CSS Styles unchanged */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #4CAF50, #45a049); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 24px; }
        .user-info { position: absolute; top: 20px; right: 20px; font-size: 12px; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px; border-radius: 4px; cursor: pointer; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .hide { display: none !important; }
        .card { background: #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { background: #4CAF50; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-secondary { background: #666; }
        .btn-google { background: white; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-danger { background: #f44336; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; font-size: 16px; }
        .batch-item { background: #3a3a3a; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .batch-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #4CAF50; }
        .batch-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .modal-content { background: #2a2a2a; margin: 20px auto; padding: 20px; max-width: 500px; border-radius: 12px; }
        .close-btn { float: right; font-size: 28px; cursor: pointer; }
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #2a2a2a; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        .expense-item { background: #3a3a3a; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-left: 10px; cursor: pointer; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #333; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #4CAF50; }
        .summary-card { background: linear-gradient(135deg, #4CAF50, #45a049); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .loading { text-align: center; padding: 50px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1>🐔 পোল্ট্রি ফার্ম</h1>
            <p style="color: #aaa; margin-bottom: 20px;">আপনার ডেটা ক্লাউডে সেভ থাকবে</p>
            
            <button class="btn btn-google" onclick="signInWithGoogle()">
                Google দিয়ে সাইন ইন করুন
            </button>
            
            <p style="margin: 15px 0;">অথবা</p>
            
            <div class="input-group" style="text-align: left;">
                <label>ইমেইল</label>
                <input type="email" id="loginEmail" placeholder="email@example.com">
            </div>
            <div class="input-group" style="text-align: left;">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="loginPassword" placeholder="******">
            </div>
            <button class="btn" onclick="signInWithEmail()">লগইন</button>
            <button class="btn btn-secondary" onclick="signUpWithEmail()">রেজিস্ট্রেশন</button>
        </div>
    </div>

    <div id="loadingScreen" class="loading hide">
        <h2>লোড হচ্ছে...</h2>
    </div>

    <div id="appContent" class="hide">
        <div class="header">
            <h1>🐔 পোল্ট্রি ফার্ম ম্যানেজার</h1>
            <div class="user-info">
                <span id="userEmail"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="mainScreen" class="container">
            <button class="btn" onclick="showModal('createBatchModal')">+ নতুন ব্যাচ তৈরি করুন</button>
            <div id="batchList" style="margin-top: 20px;"></div>
        </div>

        <div id="batchDetailsScreen" class="container hide">
            <div class="summary-card">
                <h2 id="batchDetailName">Batch Name</h2>
                <div class="summary-grid">
                    <div>খরচ: <strong id="totalExpense">0</strong></div>
                    <div>বিক্রয়: <strong id="soldAmount">0</strong></div>
                    <div>লাভ/ক্ষতি: <strong id="profitLoss">0</strong></div>
                    <div>জীবিত: <strong id="aliveChicks">0</strong></div>
                </div>
            </div>

            <div class="card">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="btn" style="margin:0" onclick="showModal('addExpenseModal')">+ খরচ</button>
                    <button class="btn" style="margin:0" onclick="showModal('addSaleModal')">+ বিক্রয়</button>
                    <button class="btn" style="margin:0; background:#f57c00" onclick="showModal('addDeathModal')">☠️ মৃত্যু</button>
                    <button class="btn btn-danger" style="margin:0" onclick="confirmDeleteBatch()">🗑️ ডিলিট</button>
                </div>
            </div>

            <div class="card">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('expenses')">খরচ</button>
                    <button class="tab-btn" onclick="switchTab('sales')">বিক্রয়</button>
                    <button class="tab-btn" onclick="switchTab('deaths')">মৃত্যু</button>
                </div>
                <div id="expenseTab"></div>
                <div id="saleTab" class="hide"></div>
                <div id="deathTab" class="hide"></div>
            </div>

            <button class="btn btn-secondary" onclick="backToMain()">← ফিরে যান</button>
        </div>
    </div>

    <div id="createBatchModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('createBatchModal')">&times;</span>
            <h2>নতুন ব্যাচ</h2>
            <div class="input-group"><label>নাম</label><input type="text" id="batchName"></div>
            <div class="input-group"><label>মোট মুরগি</label><input type="number" id="totalChicks"></div>
            <div class="input-group"><label>তারিখ</label><input type="date" id="purchaseDate"></div>
            <div class="input-group"><label>প্রাথমিক খরচ</label><input type="number" id="initialCost"></div>
            <button class="btn" onclick="createBatch()">তৈরি করুন</button>
        </div>
    </div>

    <div id="addExpenseModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addExpenseModal')">&times;</span>
            <h2>খরচ যোগ করুন</h2>
            <div class="input-group">
                <label>ধরন</label>
                <select id="expenseType">
                    <option value="feed">খাদ্য</option>
                    <option value="medicine">ঔষধ</option>
                    <option value="other">অন্যান্য</option>
                </select>
            </div>
            <div class="input-group"><label>টাকা</label><input type="number" id="expenseAmount"></div>
            <div class="input-group"><label>তারিখ</label><input type="date" id="expenseDate"></div>
            <div class="input-group"><label>নোট</label><input type="text" id="expenseNote"></div>
            <button class="btn" onclick="addExpense()">যোগ করুন</button>
        </div>
    </div>

    <div id="addSaleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addSaleModal')">&times;</span>
            <h2>বিক্রয়</h2>
            <div class="input-group"><label>সংখ্যা</label><input type="number" id="soldChicks"></div>
            <div class="input-group"><label>কেজি</label><input type="number" id="soldWeight"></div>
            <div class="input-group"><label>মোট টাকা</label><input type="number" id="saleAmount"></div>
            <div class="input-group"><label>তারিখ</label><input type="date" id="saleDate"></div>
            <button class="btn" onclick="addSale()">যোগ করুন</button>
        </div>
    </div>

    <div id="addDeathModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('addDeathModal')">&times;</span>
            <h2>মৃত্যু রেকর্ড</h2>
            <div class="input-group"><label>সংখ্যা</label><input type="number" id="deathCount"></div>
            <div class="input-group"><label>তারিখ</label><input type="date" id="deathDate"></div>
            <div class="input-group"><label>কারণ</label><input type="text" id="deathReason"></div>
            <button class="btn" onclick="addDeath()">রেকর্ড করুন</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // ✅ APNAR ASOL FIREBASE CONFIG EIKHANE BOSHANO HOYECHE
        const firebaseConfig = {
            apiKey: "AIzaSyDaWglif2TdV58Qc_84qLeKj4tMVupFlws",
            authDomain: "poultry-farm-93721.firebaseapp.com",
            databaseURL: "https://poultry-farm-93721-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "poultry-farm-93721",
            storageBucket: "poultry-farm-93721.firebasestorage.app",
            messagingSenderId: "690531682132",
            appId: "1:690531682132:web:2a12f43ac746a79b09aac1"
        };

        // Initialize
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let batches = [];
        let currentBatchId = null;
        let currentUser = null;

        // Auth Listener
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmail').innerText = user.email;
                document.getElementById('loginScreen').classList.add('hide');
                document.getElementById('appContent').classList.remove('hide');
                loadData();
            } else {
                currentUser = null;
                document.getElementById('loginScreen').classList.remove('hide');
                document.getElementById('appContent').classList.add('hide');
            }
        });

        // Auth Functions
        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => alert(e.message));
        }

        function signInWithEmail() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        function signUpWithEmail() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        function logout() {
            auth.signOut();
        }

        // Database Functions
        function loadData() {
            document.getElementById('loadingScreen').classList.remove('hide');
            const ref = db.ref('users/' + currentUser.uid + '/batches');
            ref.on('value', snapshot => {
                document.getElementById('loadingScreen').classList.add('hide');
                const data = snapshot.val();
                batches = data ? data : [];
                renderBatchList();
                if (currentBatchId) viewBatch(currentBatchId); // Refresh details if open
            });
        }

        function saveData() {
            if(!currentUser) return;
            db.ref('users/' + currentUser.uid + '/batches').set(batches);
        }

        // App Logic
        function createBatch() {
            const batch = {
                id: Date.now(),
                name: document.getElementById('batchName').value,
                totalChicks: parseInt(document.getElementById('totalChicks').value),
                aliveChicks: parseInt(document.getElementById('totalChicks').value),
                purchaseDate: document.getElementById('purchaseDate').value,
                expenses: [{
                    type: 'purchase',
                    amount: parseFloat(document.getElementById('initialCost').value),
                    date: document.getElementById('purchaseDate').value,
                    note: 'Initial Cost'
                }],
                sales: [],
                deaths: []
            };
            batches.push(batch);
            saveData();
            closeModal('createBatchModal');
        }

        function renderBatchList() {
            const container = document.getElementById('batchList');
            container.innerHTML = '';
            batches.forEach(batch => {
                const expense = (batch.expenses || []).reduce((a, b) => a + b.amount, 0);
                const sales = (batch.sales || []).reduce((a, b) => a + b.amount, 0);
                const profit = sales - expense;
                
                const div = document.createElement('div');
                div.className = 'batch-item';
                div.innerHTML = `
                    <div class="batch-header">
                        <span>${batch.name}</span>
                        <span style="color: ${profit >= 0 ? '#4CAF50' : '#f44336'}">৳${profit}</span>
                    </div>
                    <div class="batch-stats">
                        <span>জীবিত: ${batch.aliveChicks}</span>
                        <span>খরচ: ৳${expense}</span>
                    </div>
                `;
                div.onclick = () => viewBatch(batch.id);
                container.appendChild(div);
            });
        }

        function viewBatch(id) {
            currentBatchId = id;
            const batch = batches.find(b => b.id === id);
            document.getElementById('mainScreen').classList.add('hide');
            document.getElementById('batchDetailsScreen').classList.remove('hide');
            
            document.getElementById('batchDetailName').innerText = batch.name;
            const totalExp = (batch.expenses||[]).reduce((a, b) => a + b.amount, 0);
            const totalSale = (batch.sales||[]).reduce((a, b) => a + b.amount, 0);
            
            document.getElementById('totalExpense').innerText = '৳' + totalExp;
            document.getElementById('soldAmount').innerText = '৳' + totalSale;
            document.getElementById('profitLoss').innerText = '৳' + (totalSale - totalExp);
            document.getElementById('aliveChicks').innerText = batch.aliveChicks;

            // Render Tabs
            renderList('expenseTab', batch.expenses, (item) => `
                <div class="expense-item">
                    <div><b>${item.type}</b> <small>${item.date}</small></div>
                    <div style="display:flex;align-items:center">
                        <b>৳${item.amount}</b>
                        ${item.type !== 'purchase' ? `<button class="delete-btn" onclick="deleteItem('expenses', ${item.amount}, '${item.date}')">✕</button>` : ''}
                    </div>
                </div>
            `);
            
            renderList('saleTab', batch.sales, (item) => `
                <div class="expense-item">
                    <div><b>${item.soldChicks} pcs</b> <small>${item.date}</small></div>
                    <div style="display:flex;align-items:center">
                        <b style="color:#4CAF50">৳${item.amount}</b>
                        <button class="delete-btn" onclick="deleteItem('sales', ${item.amount}, '${item.date}')">✕</button>
                    </div>
                </div>
            `);

            renderList('deathTab', batch.deaths, (item) => `
                <div class="expense-item">
                    <div><b>${item.count} pcs</b> <small>${item.date}</small></div>
                    <button class="delete-btn" onclick="deleteItem('deaths', ${item.count}, '${item.date}')">✕</button>
                </div>
            `);
        }

        function renderList(elementId, list, templateFn) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            if(!list || list.length === 0) {
                el.innerHTML = '<p style="text-align:center;color:#666;padding:20px">No records</p>';
                return;
            }
            list.forEach(item => el.innerHTML += templateFn(item));
        }

        function addExpense() {
            const batch = batches.find(b => b.id === currentBatchId);
            if(!batch.expenses) batch.expenses = [];
            batch.expenses.push({
                type: document.getElementById('expenseType').value,
                amount: parseFloat(document.getElementById('expenseAmount').value),
                date: document.getElementById('expenseDate').value,
                note: document.getElementById('expenseNote').value
            });
            saveData();
            closeModal('addExpenseModal');
        }

        function addSale() {
            const batch = batches.find(b => b.id === currentBatchId);
            const chicks = parseInt(document.getElementById('soldChicks').value);
            if(chicks > batch.aliveChicks) return alert('Not enough chicks!');
            
            if(!batch.sales) batch.sales = [];
            batch.sales.push({
                soldChicks: chicks,
                weight: parseFloat(document.getElementById('soldWeight').value),
                amount: parseFloat(document.getElementById('saleAmount').value),
                date: document.getElementById('saleDate').value
            });
            batch.aliveChicks -= chicks;
            saveData();
            closeModal('addSaleModal');
        }

        function addDeath() {
            const batch = batches.find(b => b.id === currentBatchId);
            const count = parseInt(document.getElementById('deathCount').value);
            if(count > batch.aliveChicks) return alert('Not enough chicks!');

            if(!batch.deaths) batch.deaths = [];
            batch.deaths.push({
                count: count,
                date: document.getElementById('deathDate').value,
                reason: document.getElementById('deathReason').value
            });
            batch.aliveChicks -= count;
            saveData();
            closeModal('addDeathModal');
        }

        function confirmDeleteBatch() {
            if(confirm('Delete this batch?')) {
                batches = batches.filter(b => b.id !== currentBatchId);
                saveData();
                backToMain();
            }
        }

        // Helpers
        function showModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function backToMain() { 
            document.getElementById('batchDetailsScreen').classList.add('hide');
            document.getElementById('mainScreen').classList.remove('hide');
            currentBatchId = null;
        }
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            ['expenseTab','saleTab','deathTab'].forEach(t => document.getElementById(t).classList.add('hide'));
            document.getElementById(tab === 'expenses' ? 'expenseTab' : tab === 'sales' ? 'saleTab' : 'deathTab').classList.remove('hide');
        }
        
        // Auto-set dates
        const today = new Date().toISOString().split('T')[0];
        document.querySelectorAll('input[type="date"]').forEach(i => i.value = today);
    </script>
</body>
</html>
